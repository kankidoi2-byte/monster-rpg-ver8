<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ステータス確認 試作</title>
<!-- 採用された試作(2026-11-05)。リポジトリ直下に置くと images/monsters/ の画像が表示される。
     数値は stat4 改修(Lv1値 × 成長倍率)で計算した見本。本編では実際の個体の値を使う。 -->
<style>
:root{--bg:#faf8f2;--ink:#1c2230;--muted:#48566c;--sub:#5b6474;--gold:#b08d55;--line:rgba(176,141,85,.45);--night:#171c28;--cream:#f7e9ca;--goldtext:#e9c97f}
*{box-sizing:border-box}
body{margin:0;background:#e9e6dd;font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink)}
.phone{position:relative;width:100%;max-width:390px;height:844px;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit}
.serif{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.btn-dark{border:1px solid var(--gold);background:var(--night);color:var(--cream)}
.icon-btn{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 8px}
header h1{margin:0;font-size:17px;letter-spacing:.08em}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 12px 16px;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex:none}
.hero{background:var(--night);color:var(--cream);border:1px solid var(--gold);border-radius:18px;overflow:hidden}
.hero-img{position:relative;height:230px;background:#222a3b}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.stars{position:absolute;left:12px;top:12px;padding:4px 10px;border-radius:999px;background:rgba(23,28,40,.78);border:1px solid rgba(176,141,85,.7);color:var(--goldtext);font-size:13px;letter-spacing:.1em}
.hero-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.name-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.name-row h2{margin:0;font-size:22px;line-height:1.3}
.lv{flex:none;font-size:15px;color:var(--goldtext)}.lv b{font-size:26px;color:var(--cream)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid rgba(247,233,202,.4)}
.type{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.exp-head{display:flex;justify-content:space-between;font-size:12px;color:#cdbf9f}
.exp-bar{height:6px;border-radius:3px;background:rgba(247,233,202,.16);overflow:hidden}.exp-bar i{display:block;height:100%;background:var(--goldtext)}
.card{background:#fff;border:1px solid rgba(176,141,85,.4);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:15px;letter-spacing:.06em}
.stat{display:grid;grid-template-columns:44px minmax(0,1fr) 56px;align-items:center;gap:10px}
.stat span:first-child{font-size:13px;font-weight:700}
.bar{height:10px;border-radius:5px;background:#eceae3;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.stat b{text-align:right;font-size:17px;font-variant-numeric:tabular-nums}
.alch{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid #eceae3;font-size:13px}
.skill{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:12px;background:var(--bg)}
.skill .dot{flex:none;width:10px;height:10px;border-radius:50%}.skill .nm{flex:1;font-size:14px}
.skill small{font-size:12px;color:var(--sub)}.skill em{font-style:normal;font-size:12px;color:#7a5a24;font-weight:700}
/* 入口:詳細シート */
.backdrop{position:absolute;inset:0;background:rgba(23,28,40,.55);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--gold);padding:12px 16px 22px;display:flex;flex-direction:column;gap:10px}
.sheet-top{display:flex;gap:12px;align-items:center}.sheet-top img{width:96px;height:96px;border-radius:16px;object-fit:cover;border:1px solid var(--gold)}
.sheet-top h2{margin:0;font-size:20px}.sheet-top p{margin:2px 0;font-size:13px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mini div{background:#fff;border:1px solid rgba(176,141,85,.35);border-radius:12px;padding:8px 4px;text-align:center}
.mini small{display:block;font-size:11px;font-weight:700}.mini b{font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid{padding:84px 12px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid i{aspect-ratio:1;border-radius:12px;background:#e6e1d4}
.hidden{display:none!important}
.tabs{display:flex;justify-content:center;gap:8px;padding:12px}
</style>
</head>
<body>
<div class="tabs"><button class="btn" onclick="showView('sheet')">入口：詳細シート</button><button class="btn" onclick="showView('status')">ステータス画面</button></div>

<div class="phone" id="viewSheet">
  <div class="grid" aria-hidden="true"></div>
  <div class="backdrop"><section class="sheet" role="dialog" aria-labelledby="sheetName">
    <div style="display:flex;justify-content:flex-end"><button class="btn" aria-label="詳細を閉じる">閉じる ×</button></div>
    <div class="sheet-top"><img id="sheetImg" alt=""><div><h2 class="serif" id="sheetName"></h2><p id="sheetMeta"></p><p id="sheetLv"></p></div></div>
    <div class="mini" id="sheetStats"></div>
    <p style="margin:0;font-size:13px" id="sheetSkills"></p>
    <div class="two"><button class="btn btn-dark serif" onclick="showView('status')">ステータス</button><button class="btn serif">技変更</button></div>
    <button class="btn" style="text-align:left">データを使う ▾</button>
  </section></div>
</div>

<div class="phone hidden" id="viewStatus">
  <header>
    <button class="btn serif" onclick="showView('sheet')">‹ 一覧へ</button>
    <h1 class="serif">ステータス</h1>
    <div style="display:flex;gap:6px">
      <button class="btn icon-btn" aria-label="前の仲間" onclick="move(-1)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="btn icon-btn" aria-label="次の仲間" onclick="move(1)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </header>
  <div class="scroll">
    <section class="hero">
      <div class="hero-img"><img id="heroImg" alt=""><div class="stars" id="heroStars"></div></div>
      <div class="hero-body">
        <div class="name-row"><h2 class="serif" id="heroName"></h2><div class="lv serif">Lv.<b id="heroLv"></b></div></div>
        <div class="chips" id="heroChips"></div>
        <div><div class="exp-head"><span>EXP</span><span id="heroExp"></span></div><div class="exp-bar"><i id="heroExpBar"></i></div></div>
      </div>
    </section>
    <section class="card"><h3 class="serif">能力</h3><div id="stats" style="display:flex;flex-direction:column;gap:12px"></div><div class="alch hidden" id="alch"><span style="color:var(--sub)">錬成の補正</span><b id="alchText"></b></div></section>
    <section class="card" style="gap:8px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><h3 class="serif">装備している技</h3><span style="font-size:12px;color:var(--sub)" id="cost"></span></div>
      <div id="skills" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="btn btn-dark serif" style="margin-top:4px">技を変更する</button>
    </section>
  </div>
</div>

<script>
// 試作用の見本データ。本編では個体(instance)・種族データ・装備技から計算する。
const MAX={hp:2256,atk:930,def:888,spd:224}; // 全ユニットのLv100の最大値(本編では表から計算する)
const COLORS={hp:'#2f7a3c',atk:'#b8322c',def:'#245b98',spd:'#9a7424'};
const LABELS={hp:'HP',atk:'攻撃',def:'防御',spd:'速度'};
const TYPES={fire:['炎','#c2462b'],water:['水','#1f6aa5'],thunder:['雷','#8a6a12'],wind:['風','#2b7a68'],dragon:['竜','#5b3fa3'],normal:['無','#5b6474'],grass:['草','#2f7a3c']};
const units=[
 {name:'フレイガル',img:'images/monsters/freigal_20260919.webp',stars:'★',kind:'モンスター',types:['fire'],lv:12,exp:430,need:720,now:{hp:179,atk:105,def:71,spd:64},alchemy:'',skills:[['火炎牙',2,34,'fire'],['フレイムクロー',2,34,'fire']],costLimit:7},
 {name:'ボルタックス',img:'images/monsters/voltax_20260921_square.webp',stars:'★★★',kind:'モンスター',types:['thunder','wind'],lv:45,exp:1200,need:2700,now:{hp:593,atk:237,def:222,spd:123},alchemy:'',skills:[['雷光弾',3,42,'thunder'],['身構える',2,0,'normal'],['集中',1,0,'normal']],costLimit:20},
 {name:'オルカアビス',img:'images/monsters/orca_abyss_20260920.webp',stars:'★★★★',kind:'モンスター',types:['water'],lv:70,exp:3100,need:4200,now:{hp:1284,atk:411,def:380,spd:101},alchemy:'HP ×1.05',skills:[['ストリームテイル',4,54,'water'],['身構える',2,0,'normal'],['集中',1,0,'normal']],costLimit:31},
 {name:'賢金神竜エリクシオン',img:'images/monsters/elixion_20260920.webp',stars:'★★★★★',kind:'モンスター',types:['normal','dragon'],lv:100,exp:0,need:0,now:{hp:2256,atk:861,def:847,spd:217},alchemy:'',skills:[['しっぽ打ち',1,26,'normal'],['身構える',2,0,'normal'],['集中',1,0,'normal']],costLimit:43}
];
let i=1;
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('ja-JP');
const pct=(v,k)=>Math.max(2,Math.min(100,v/MAX[k]*100));
function render(){
 const u=units[i],maxed=u.lv>=100,cost=u.skills.reduce((s,k)=>s+k[1],0);
 $('heroImg').src=u.img;$('heroImg').alt=u.name;$('heroStars').textContent=u.stars;$('heroName').textContent=u.name;$('heroLv').textContent=u.lv;
 $('heroChips').innerHTML=`<span class="chip">${u.kind}</span>`+u.types.map(t=>`<span class="type" style="background:${TYPES[t][1]}">${TYPES[t][0]}</span>`).join('');
 $('heroExp').textContent=maxed?'MAX':`${fmt(u.exp)} / ${fmt(u.need)}`;$('heroExpBar').style.width=(maxed?100:u.exp/u.need*100)+'%';
 $('stats').innerHTML=Object.keys(LABELS).map(k=>`<div class="stat"><span>${LABELS[k]}</span><div class="bar"><i style="width:${pct(u.now[k],k)}%;background:${COLORS[k]}"></i></div><b class="serif">${fmt(u.now[k])}</b></div>`).join('');
 $('alch').classList.toggle('hidden',!u.alchemy);$('alchText').textContent=u.alchemy;
 $('cost').textContent=`コスト ${cost} / ${u.costLimit}`;
 $('skills').innerHTML=u.skills.map(k=>`<div class="skill"><span class="dot" style="background:${TYPES[k[3]][1]}"></span><span class="nm">${k[0]}</span><small>${k[2]>0?'威力 '+k[2]:'補助'}</small><em>C${k[1]}</em></div>`).join('');
 $('sheetImg').src=u.img;$('sheetImg').alt=u.name;$('sheetName').textContent=u.name;
 $('sheetMeta').textContent=`${u.kind} / ${u.stars} / ${u.types.map(t=>TYPES[t][0]).join('・')}`;
 $('sheetLv').textContent=`Lv.${u.lv} ・ ${maxed?'EXP MAX':'EXP '+fmt(u.exp)+'/'+fmt(u.need)} ・ 所持 1体`;
 $('sheetStats').innerHTML=Object.keys(LABELS).map(k=>`<div><small style="color:${COLORS[k]}">${LABELS[k]}</small><b class="serif">${fmt(u.now[k])}</b></div>`).join('');
 $('sheetSkills').innerHTML=`装備技：${u.skills.map(k=>k[0]).join(' / ')}<br><span style="color:var(--muted)">コスト ${cost}/${u.costLimit}</span>`;
}
function move(d){i=(i+d+units.length)%units.length;render();}
function showView(v){$('viewSheet').classList.toggle('hidden',v!=='sheet');$('viewStatus').classList.toggle('hidden',v!=='status');}
document.querySelector('.grid').innerHTML='<i></i>'.repeat(25);
render();
</script>
</body>
</html>
