<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>50体のモーション確認</title><link rel="stylesheet" href="tools/motion-review/catalog.css"></head><body>
<header><p class="eyebrow">MONSTER MOTION · PHASE C</p><h1>50体のモーション確認</h1><p id="counts" role="status"></p><p>選んだ1体だけ再生します。気になる個体に印を付ければ、まとめて見直せます。</p></header>
<main><section class="filters" aria-label="一覧の絞り込み"><label>名前・図鑑番号<input id="search" type="search" placeholder="例：スライム"></label><label>表示<select id="filter"><option value="registered">登録済み</option><option value="all">全50体</option><option value="pending">登録待ち</option><option value="unreviewed">登録済み・未確認</option><option value="issue">気になる</option><option value="ok">見た目確認済み</option></select></label><button id="export">確認記録をまとめる</button></section>
<p id="storageStatus" role="status">印とメモはこの端末内に保存します。本編のセーブは使用しません。</p><p id="empty" hidden>この条件のモンスターはいません。</p><div id="cards" class="cards"></div>
<details id="reportPanel"><summary>共有用の確認記録</summary><p>下の文章をコピーして、このチャットに送れます。記録は自動送信されません。</p><textarea id="report" rows="10" readonly aria-label="共有用の確認記録"></textarea><button id="copy">記録をコピー</button><span id="copyStatus" role="status"></span></details>
</main>
<dialog id="inspector" aria-labelledby="detailName"><div class="dialog-top"><h2 id="detailName"></h2><button id="close">閉じる</button></div><p id="detailState"></p><div id="stage" class="stage dark"><img id="still" alt=""><video id="motion" muted playsinline loop controls preload="none" hidden></video></div><p id="playStatus" role="status"></p><div class="actions"><button id="play">再生</button><button id="pause">停止</button><button id="side">味方の向き</button><label>背景<select id="background"><option value="dark">濃紺</option><option value="light">白</option><option value="grass">草原</option></select></label></div><p class="hint">ここでは素材の見た目を確認できます。HPや操作との重なりは、必要な個体だけ戦闘画面で確認してください。</p><a id="battleLink">この個体を戦闘画面で確認</a>
<fieldset id="reviewFields"><legend>今回の見た目</legend><div class="actions"><button data-mark="ok">確認済み</button><button data-mark="issue">気になる</button><button data-mark="unreviewed">未確認に戻す</button></div><label>気になる点・メモ<textarea id="note" rows="2" maxlength="1000" placeholder="例：敵側で尾が切れて見える"></textarea></label></fieldset><p id="markStatus" role="status"></p><div class="actions"><button id="previous">前の個体</button><button id="next">次の個体</button></div></dialog>
<script src="tools/motion-review/catalog-data.generated.js"></script><script src="tools/motion-review/catalog.js"></script></body></html>
