<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>技演出・比較プレビュー</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='32'%3E⚔%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#111925;color:#f5f1e5;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 12px}p{line-height:1.6;color:#c8ccd5;margin:10px 0}label{display:block;margin:8px 0}select,button{font:inherit;border:1px solid #677585;border-radius:8px;padding:11px;color:#fff;background:#24374a}select{width:100%}button{background:#8b5c22;font-weight:700;min-height:44px}button:disabled{opacity:.5}a{color:#ffd697}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}iframe{width:100%;height:385px;border:1px solid #657184;border-radius:10px;background:#152638}h2{font-size:17px;margin:6px 0}details{margin-top:18px}#status{min-height:24px;font-size:14px}@media(max-width:620px){.scenes{grid-template-columns:1fr}iframe{height:330px}.controls{grid-template-columns:1fr 1fr}main{padding:12px}.scenes article:last-child{border-top:1px solid #435067;padding-top:8px}}
</style></head><body><main><h1>技演出・比較プレビュー</h1><div class="controls"><label class="wide">技<select id="move"><option value="normal">通常攻撃</option><option value="fang">火炎牙</option><option value="claw">フレアクロー</option><option value="breath">コスモブレス</option><option value="charge">突進</option><option value="lightning">雷撃</option><option value="repeat">ライトニングチェイン（2撃）</option><option value="heal">自己回復</option><option value="guard">防御</option><option value="debuff">弱体化（互換経路）</option></select></label><label>攻撃元・対象<select id="direction"><option value="player">味方 → 敵</option><option value="enemy">敵 → 味方</option><option value="rivals">敵A → 敵B</option></select></label><label>動き<select id="motion"><option value="full">通常</option><option value="reduced">減らす</option></select></label><button id="play" disabled>両方を再生</button><button id="reset">リセット</button></div><p id="status" role="status">比較画面を読み込んでいます…</p><div class="scenes"><article><h2>修正後</h2><iframe title="修正後の演出" src="docs/skill-impact/scene.html"></iframe></article><article><h2>修正前（main）</h2><iframe title="修正前の演出" src="docs/skill-impact/scene.html?before=1"></iframe></article></div><p><a href="index.html">確認版のゲームを開く</a> · <a href="docs/skill-impact/coverage.md">全技の対応一覧</a></p><details><summary>比較の見方</summary><p>演出とHP更新の位置・タイミングを比較するための固定値サンプルです。攻撃は24、回復は27で表示し、追加攻撃は必ず2撃にしています。本編の確率や威力は変更していません。修正前は基準mainの描画コードを使用します。</p><p>自己回復・防御は使用者が対象です。弱体化は現在の登録技にはない既存処理の補完です。実戦の確認は「確認版のゲームを開く」から行えます。</p></details></main><script>
const frames=[...document.querySelectorAll('iframe')];let done=0,ready=0;
document.getElementById('play').onclick=()=>{done=0;document.getElementById('play').disabled=true;document.getElementById('reset').disabled=true;document.getElementById('status').textContent='再生中…';const settings={kind:'play',move:document.getElementById('move').value,direction:document.getElementById('direction').value,reduced:document.getElementById('motion').value==='reduced'};frames.forEach(f=>f.contentWindow.postMessage(settings,location.origin));};
document.getElementById('reset').onclick=()=>frames.forEach(f=>f.contentWindow.postMessage({kind:'reset'},location.origin));
window.addEventListener('message',e=>{if(e.origin!==location.origin||!frames.some(f=>f.contentWindow===e.source))return;if(e.data.kind==='ready'&&++ready===2){document.getElementById('play').disabled=false;document.getElementById('status').textContent='同じ技を修正前後で比較できます。';}if(e.data.kind==='done'&&++done===2){document.getElementById('play').disabled=false;document.getElementById('reset').disabled=false;document.getElementById('status').textContent='再生完了。数字が出た瞬間のエフェクトとHP変化を比べてください。';}});
</script></body></html>
