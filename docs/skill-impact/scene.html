<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>技演出サンプル</title><script>
const isBefore=new URLSearchParams(location.search).has('before');const root=isBefore?'review-baseline/':'';
document.write('<link rel="stylesheet" href="'+root+'css/ui-redesign.css">');
for(const file of ['data','core','battle-view'])document.write('<script src="'+root+'js/'+file+'.js"><\/script>');
</script><style>
*{box-sizing:border-box}body{margin:0;background:#152638;color:#fff;font:14px system-ui,sans-serif}#battle{display:block;padding:8px}.battle-arena{position:relative;display:block;height:270px;background:radial-gradient(ellipse at center,#385364,#101d2c);border:0;overflow:hidden}.unit{position:absolute;width:128px;text-align:center;z-index:2}.unit img{height:85px;width:110px;object-fit:contain}.unit .visual{height:85px;width:110px;margin:auto}.enemy{top:5px;right:10px}.ally{bottom:6px;left:10px}.bar{height:10px;background:#15201c;border-radius:6px;overflow:hidden}.hp{height:100%;background:#60cf87;transition:width .18s}.name{font-weight:700}.result{height:22px;color:#ffe2a2;font-size:13px}.timing{margin:4px 0 0;line-height:1.3;font-size:12px;color:#dbe7ef}.battle-damage-burst{font-size:24px}.battle-arena.battle-impact-stop,.battle-arena.battle-impact-strong{animation:none}.reduced .battle-hit-impact,.reduced .battle-damage-burst{animation:none}.reduced .battle-element-flash{display:none}@media(min-height:370px){.battle-arena{height:315px}.unit img,.unit .visual{height:108px}.unit{width:150px}}
</style></head><body><div id="battle"><div class="battle-arena"><div class="unit enemy"><div id="targetName" class="name">敵</div><div id="eVis" class="visual"></div><div class="bar"><div id="eHpBar" class="hp"></div></div><div id="eHpText">100 / 100</div><div id="eResult" class="result"></div></div><div class="unit ally"><div id="sourceName" class="name">味方</div><div id="pVis" class="visual"></div><div class="bar"><div id="pHpBar" class="hp"></div></div><div id="pHpText">60 / 100</div><div id="pResult" class="result"></div></div></div><p class="timing" id="timing">発動 → 命中 → 結果</p></div><script>
const nativeMatchMedia=window.matchMedia.bind(window);let reduced=false,playing=false;window.matchMedia=q=>q==='(prefers-reduced-motion: reduce)'&&reduced?{matches:true}:nativeMatchMedia(q);
const cases={normal:['通常攻撃',24,'normal'],fang:skillToMove('skill_freigal_01'),claw:skillToMove('skill_freigal_02'),breath:skillToMove('skill_nemes_03'),charge:skillToMove('skill_freigal_03'),lightning:skillToMove('skill_spaquinn_01'),repeat:MOVE_CARDS.filter(s=>s.effect==='repeat_attack').map(s=>skillToMove(s.id))[0],heal:skillToMove('skill_luxseed_03'),guard:skillToMove('skill_elna_beginner_02'),debuff:['弱体化',0,'dark','debuff']};
let hp={p:60,e:100};function paint(){for(const side of ['p','e']){document.getElementById(side+'HpBar').style.width=hp[side]+'%';document.getElementById(side+'HpText').textContent=hp[side]+' / 100';}}
function reset(){if(playing)return;if(typeof clearBattleVisuals==='function')clearBattleVisuals();document.querySelectorAll('.battle-damage-burst,.battle-element-flash').forEach(e=>e.remove());hp={p:60,e:100};paint();for(const s of ['p','e'])document.getElementById(s+'Result').textContent='';document.getElementById('timing').textContent='発動 → 命中 → 結果';}
document.getElementById('pVis').innerHTML='<img src="'+IMG.freigal+'" alt="フレイガル">';document.getElementById('eVis').innerHTML='<img src="'+IMG.aquaron+'" alt="アクアロン">';reset();
async function run(settings){if(playing)return;reset();playing=true;reduced=settings.reduced;document.body.classList.toggle('reduced',reduced);let source=settings.direction==='enemy'?'e':'p',target=source==='p'?'e':'p';document.getElementById('sourceName').textContent=settings.direction==='rivals'?'敵A':'味方';document.getElementById('targetName').textContent=settings.direction==='rivals'?'敵B':'敵';const mv=cases[settings.move]||cases.normal;const self=['heal','guard','buff','aqua_shield'].includes(mv[3]);if(self){target=source;if(mv[3]==='heal'){hp[source]=60;paint();}}else if(isBefore&&mv[3]==='debuff')target=source;
 const t0=performance.now(),times=[];const hit=()=>{const actualTarget=mv[3]==='debuff'?(source==='p'?'e':'p'):target;if(mv[1]>0){hp[actualTarget]=Math.max(0,hp[actualTarget]-24);playBattleImpact(actualTarget+'Vis',24,1,mv[2],mv[1]);document.getElementById(actualTarget+'Result').textContent='被弾 −24';}else if(mv[3]==='heal'){const healed=Math.min(27,100-hp[source]);hp[source]+=healed;document.getElementById(source+'Result').textContent='回復 +'+healed;}else document.getElementById(actualTarget+'Result').textContent=mv[3]==='debuff'?'攻撃 ×0.8':'防御';paint();times.push(Math.round(performance.now()-t0));document.getElementById('timing').textContent='結果表示：'+times.join('ms / ')+'ms';};
 try{await playBattleSkillMotion(source+'Vis',target+'Vis',mv,{untilImpact:!isBefore});hit();if(settings.move==='repeat'){if(!isBefore){await finishBattleSkillMotion(true);await playBattleSkillMotion(source+'Vis',target+'Vis',mv,{untilImpact:true});}if(isBefore){hp[target]=Math.max(0,hp[target]-24);paint();document.getElementById(target+'Result').textContent='被弾 −24 ／ 追加攻撃 −24';times.push(Math.round(performance.now()-t0));document.getElementById('timing').textContent='結果表示：'+times.join('ms / ')+'ms';}else hit();}if(!isBefore)await finishBattleSkillMotion(true);}catch(e){document.getElementById('timing').textContent='エラー：'+e.message;console.error(e);}finally{playing=false;parent.postMessage({kind:'done'},location.origin);}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data.kind==='reset')reset();if(e.data.kind==='play')run(e.data);});
parent.postMessage({kind:'ready'},location.origin);
</script></body></html>
