name: Verify published Soul Contract
on:
  push:
    branches: [verify/soul-contract-live-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify real public single and ten draws with isolated local saves
        env:
          GAME_TEST_URL: https://pactforge-studio.github.io/monster-rpg-ver8/
        run: node scripts/test-soul-contract-browser.mjs
      - name: Upload published-game verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-contract-published-evidence
          path: artifacts/soul-contract
