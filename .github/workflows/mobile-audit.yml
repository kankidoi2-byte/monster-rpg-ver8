name: Mobile audit journey
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  journey:
    if: github.head_ref == 'qa/mobile-full-audit-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: node scripts/prologue-e2e/run.mjs
        env:
          PROLOGUE_E2E_DIR: artifacts/journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-journey
          path: artifacts/journey
          if-no-files-found: error
