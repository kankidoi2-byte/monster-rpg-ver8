name: Full prologue touch journey
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/prologue-e2e/**'
      - '.github/workflows/prologue-journey.yml'

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: node scripts/prologue-e2e/run.mjs
        env:
          PROLOGUE_E2E_DIR: artifacts/journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prologue-touch-journey
          path: artifacts/journey
          if-no-files-found: error
