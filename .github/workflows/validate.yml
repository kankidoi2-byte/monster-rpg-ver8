name: Validate game data and assets

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate data and image budgets
        run: npm run check

      - name: Compare world-map reward rules with the pre-map baseline
        run: npm run check:world-map-economy

      - name: Install isolated browser for skill-card layout checks
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Verify mobile skill-card layout and interactions
        run: |
          node scripts/test-skill-dex-portrait-browser.mjs
          node scripts/test-skill-card-layout.mjs

      - name: Verify balance changes and gameplay smoke
        run: |
          node scripts/test-morglum-browser.mjs
          node scripts/test-seraphic-leaf-browser.mjs
          node scripts/test-crash-rush-browser.mjs
          node scripts/test-evolution-skill-cards-browser.mjs
          node scripts/test-evolution-native-card-migration-browser.mjs
          node scripts/test-simultaneous-ko-browser.mjs
          node scripts/test-single-hp-clamp-browser.mjs
          node scripts/test-powered-modifiers-browser.mjs
          node scripts/test-skill-dex-browser.mjs
          node scripts/test-status-descriptions-browser.mjs
          node scripts/test-normal-healing-browser.mjs

      - name: Upload skill-card layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-card-layout
          path: artifacts/skill-card-layout

  monochrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify nonbattle monochrome layout and isolation
        run: node scripts/test-monochrome-browser.mjs
      - name: Upload nonbattle monochrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonbattle-monochrome-evidence
          path: artifacts/nonbattle-theme

      - name: Upload nonbattle verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonbattle-monochrome-manifest
          path: artifacts/nonbattle-theme/manifest.json

  soul-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify Soul Contract runtime and interruption safety
        run: node scripts/test-soul-contract-browser.mjs
      - name: Upload Soul Contract browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-contract-evidence
          path: artifacts/soul-contract
      - name: Upload Soul Contract manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-contract-manifest
          path: artifacts/soul-contract/manifest.json

  save-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify save failure boundaries in isolated profiles
        run: node scripts/test-save-transactions-browser.mjs
      - name: Upload save transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-transaction-evidence
          path: artifacts/save-transactions
