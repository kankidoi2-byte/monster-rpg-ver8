name: Validate game data and assets

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate data and image budgets
        run: npm run check

      - name: Compare world-map reward rules with the pre-map baseline
        run: npm run check:world-map-economy

      - name: Install isolated browser for skill-card layout checks
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Verify mobile skill-card layout and interactions
        run: node scripts/test-skill-card-layout.mjs

      - name: Verify balance changes and gameplay smoke
        run: |
          node scripts/test-morglum-browser.mjs
          node scripts/test-seraphic-leaf-browser.mjs

      - name: Upload skill-card layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-card-layout
          path: artifacts/skill-card-layout
